<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#eef2f7; stroke:#334155; stroke-width:1.5; rx:6; }
    .title { font-size:13px; font-weight:bold; fill:#0f172a; }
    .sub { font-size:10px; fill:#475569; }
    .arrow { stroke:#334155; stroke-width:1.5; fill:none; marker-end:url(#arr); }
  </style>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker></defs>

  <rect x="40" y="60" width="220" height="220" class="box" fill="#fef9c3"/>
  <text x="150" y="85" text-anchor="middle" class="title">Milvus (standalone)</text>
  <text x="150" y="103" text-anchor="middle" class="sub">milvusdb/milvus:v2.5.27</text>
  <text x="150" y="121" text-anchor="middle" class="sub">embedded etcd · local storage</text>
  <text x="150" y="145" text-anchor="middle" class="sub" font-weight="bold">Collection je Modell:</text>
  <text x="52" y="165" class="sub">docvec_Qwen3-Embedding-0.6B</text>
  <text x="52" y="181" class="sub">docvec_Qwen3-Embedding-4B</text>
  <text x="52" y="197" class="sub">docvec_Qwen3-Embedding-8B</text>
  <text x="150" y="220" text-anchor="middle" class="sub">Index: AUTOINDEX · COSINE</text>
  <text x="150" y="238" text-anchor="middle" class="sub">Ports: 19530 · /healthz:9091</text>

  <line x1="260" y1="150" x2="330" y2="150" class="arrow"/>

