  <text x="430" y="85" text-anchor="middle" class="title">Collection-Schema</text>
  <text x="342" y="105" class="sub" font-weight="bold">document_id (VarChar, PK)</text>
  <text x="342" y="121" class="sub" font-weight="bold">chunk_index (Int64)</text>
  <text x="342" y="137" class="sub" font-weight="bold">vector (FloatVector)</text>
  <text x="342" y="155" class="sub">  dim: 1024/2560/4096</text>
  <text x="342" y="175" class="sub">Index: vector_idx · AUTOINDEX</text>
  <text x="342" y="191" class="sub">metricType: COSINE</text>

  <line x1="430" y1="210" x2="430" y2="260" class="arrow"/>

  <rect x="330" y="260" width="200" height="90" class="box" fill="#dcfce7"/>
  <text x="430" y="285" text-anchor="middle" class="title">Suche (POST /api/search)</text>
  <text x="342" y="305" class="sub">Query → Embedding → Vektor</text>
  <text x="342" y="321" class="sub">Cosinus-Ähnlichkeitssuche</text>
