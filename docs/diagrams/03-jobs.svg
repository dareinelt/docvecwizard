<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#eef2f7; stroke:#334155; stroke-width:1.5; rx:6; }
    .title { font-size:13px; font-weight:bold; fill:#0f172a; }
    .sub { font-size:10px; fill:#475569; }
    .arrow { stroke:#334155; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    .done { fill:#dcfce7; }
    .fail { fill:#fee2e2; }
  </style>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker></defs>

  <rect x="60" y="130" width="120" height="50" class="box"/>
  <text x="120" y="152" text-anchor="middle" class="title">CREATED</text>
  <text x="120" y="168" text-anchor="middle" class="sub">angelegt</text>

  <rect x="240" y="130" width="120" height="50" class="box" fill="#fef9c3"/>
  <text x="300" y="152" text-anchor="middle" class="title">RUNNING</text>
  <text x="300" y="168" text-anchor="middle" class="sub">verarbeitet</text>

  <rect x="420" y="80" width="130" height="50" class="box done"/>
  <text x="485" y="102" text-anchor="middle" class="title">COMPLETED</text>
  <text x="485" y="118" text-anchor="middle" class="sub">erfolgreich</text>

  <rect x="420" y="180" width="130" height="50" class="box fail"/>
  <text x="485" y="202" text-anchor="middle" class="title">FAILED</text>
  <text x="485" y="218" text-anchor="middle" class="sub">Fehler</text>

  <rect x="600" y="180" width="130" height="50" class="box"/>
  <text x="665" y="202" text-anchor="middle" class="title">CANCELLED</text>
  <text x="665" y="218" text-anchor="middle" class="sub">abgebrochen</text>

  <line x1="180" y1="155" x2="240" y2="155" class="arrow"/>
  <line x1="360" y1="150" x2="420" y2="105" class="arrow"/>
  <line x1="360" y1="155" x2="420" y2="205" class="arrow"/>
  <line x1="360" y1="160" x2="600" y2="205" class="arrow"/>

  <text x="60" y="40" class="title" font-size="15">Job-Lebenszyklus</text>
  <text x="60" y="60" class="sub">1. POST /api/jobs legt Job mit status=CREATED an</text>
  <text x="60" y="76" class="sub">2. Worker übernimmt atomar (CREATED → RUNNING)</text>
  <text x="60" y="92" class="sub">3. finalizeJob() setzt COMPLETED / FAILED · Cancel setzt CANCELLED</text>

  <rect x="60" y="250" width="650" height="50" fill="none" stroke="#94a3b8" stroke-dasharray="4" rx="6"/>
  <text x="75" y="272" class="sub">Crash Recovery: recoverStaleWork() setzt beim Start RUNNING→CREATED und PROCESSING→DISCOVERED</text>
  <text x="75" y="288" class="sub">Graceful Shutdown: SIGTERM/SIGINT beenden den laufenden Schritt sauber</text>
</svg>
