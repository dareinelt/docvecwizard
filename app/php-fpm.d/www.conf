; PHP-FPM pool for the Document Embedding Manager app.
; Runs as the non-root `app` user and listens on all interfaces so the nginx
; `web` container can reach it over the internal network.

[www]
user = app
group = app

listen = 0.0.0.0:9000
listen.owner = app
listen.group = app

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Critical: pass container environment variables (MYSQL_*, MILVUS_*, ...) through
; to PHP. Without this, getenv() is empty under php-fpm.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

php_admin_value[log_errors] = on
