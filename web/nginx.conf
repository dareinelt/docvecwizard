worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Basic request-rate limit per client for the API (login brute force is
    # additionally throttled in the application).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        # SECURITY FIX: "HIGH:!aNULL:!MD5" still allowed CBC/SHA1 and non-PFS suites.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 200m;

        # SECURITY FIX: no security headers were sent at all. The SPA uses no
        # inline scripts/styles, so a strict CSP is possible.
        # NOTE: nginx drops inherited add_header directives in any location that
        # defines its own add_header -> they are repeated via the include below.
        include /etc/nginx/security-headers.conf;

        # Liveness endpoint -> PHP front controller
        location = /healthz {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS on;
            fastcgi_pass app:9000;
        }

        # REST API -> PHP front controller
        # ^~ : regex locations below (static assets, dotfiles) must never
        # shadow API paths such as /api/... ending in ".json".
        location ^~ /api/ {
            limit_req zone=api burst=100 nodelay;
            limit_req_status 429;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            # Explicit TLS flag -> PHP marks the session cookie "Secure".
            fastcgi_param HTTPS on;
            # FIX: exports, imports and integrity checks run longer than the
            # 60 s default and were cut off with 504 Gateway Timeout.
            fastcgi_read_timeout 600s;
            fastcgi_send_timeout 600s;
            # Stream large downloads instead of buffering them to disk.
            fastcgi_buffering off;
            fastcgi_pass app:9000;
        }

        # Never serve dotfiles (e.g. .git, .env) should they end up in the web root.
        location ~ /\. {
            deny all;
            return 404;
        }

        # Static assets (local only, no CDN)
        location ~* \.(css|js|svg|ico|png|jpg|jpeg|gif|webp|woff2?|ttf|json|txt|map)$ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public";
            include /etc/nginx/security-headers.conf;
        }

        # Single-page app fallback (HTML must not be cached: it references the current assets).
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
        }
    }
}
